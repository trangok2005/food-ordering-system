{# Trường dùng chung cho form thêm/sửa món ăn.
   Khi sửa: truyền dish_data là object Dish để điền sẵn giá trị. #}
<div class="mb-3">
  <label class="form-label">Tên món <span class="text-danger">*</span></label>
  <input type="text" name="name" class="form-control" required maxlength="255"
         value="{% if dish_data %}{{ dish_data.name }}{% endif %}" />
</div>
<div class="row">
  <div class="col-md-6 mb-3">
    <label class="form-label">Danh mục <span class="text-danger">*</span></label>
    <select name="category_id" class="form-select" required>
      {% for category in categories %}
      <option value="{{ category.id }}"
              {% if dish_data and dish_data.category_id == category.id %}selected{% endif %}>
        {{ category.name }}
      </option>
      {% endfor %}
    </select>
  </div>
  <div class="col-md-6 mb-3">
    <label class="form-label">Giá bán (VNĐ) <span class="text-danger">*</span></label>
    <input type="number" name="price" class="form-control" required min="0" step="1000"
           value="{% if dish_data %}{{ dish_data.price }}{% endif %}" />
  </div>
</div>
<div class="mb-3">
  <label class="form-label">Mô tả</label>
  <textarea name="description" class="form-control" rows="2"
            maxlength="500">{% if dish_data and dish_data.description %}{{ dish_data.description }}{% endif %}</textarea>
</div>
<div class="mb-3">
  <label class="form-label">Link hình ảnh</label>
  <input type="url" name="image" class="form-control" placeholder="https://..."
         value="{% if dish_data and dish_data.image %}{{ dish_data.image }}{% endif %}" />
</div>
