<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>{%block title%}{%endblock%}</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="{{ url_for('static', filename='images/sushi-icon.svg') }}" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Playfair+Display:wght@700;900&family=Lato:wght@400;700&display=swap"
      rel="stylesheet" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous" />

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
      crossorigin="anonymous"></script>

    <link
      href="{{ url_for('static', filename='css/styles.css') }}"
      rel="stylesheet" />
    <script
      type="module"
      src="{{ url_for('static', filename='js/app.js') }}"></script>
  </head>
  <body class="d-flex flex-column min-vh-100">
    {%block header%} {%include 'layout/header.html'%} {%endblock%} {%block
    style%} {%endblock%}

    <div class="container flex-grow-1">
      {%block content required%} {%endblock%}
    </div>

    {%block footer%}
    <footer class="mt-auto">{%include 'layout/footer.html'%}</footer>
    {%endblock%} {%block scripts%} {%endblock%}
  </body>
</html>
