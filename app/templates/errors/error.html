{% extends 'layout/base.html' %}
{% block title %}{{ code }} - {{ title }} | Food Ordering System{% endblock %}

{% block content %}
<section class="error-page" role="alert">
  <div>
      <p class="error-code">{{ code }}</p>
      <h1 class="mb-3">{{ title }}</h1>
      <p class="text-muted mb-4">{{ message }}</p>
      <div class="d-flex justify-content-center gap-2 flex-wrap">
        <a href="{{ url_for('index') }}" class="btn btn-primary">Về trang chủ</a>
        {% if not current_user.is_authenticated %}
        <a href="{{ url_for('auth.login_view') }}" class="btn btn-outline-secondary">Đăng nhập</a>
        {% endif %}
      </div>
  </div>
</section>
{% endblock %}
