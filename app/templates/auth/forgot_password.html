{% extends 'layout/base.html' %}
{% block title %}Quên mật khẩu | Food Ordering System{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand-mark" aria-hidden="true">?</div>
    <h1 class="auth-title">Quên mật khẩu</h1>

    <p class="auth-lead">
      Nhập tên đăng nhập hoặc email của bạn. Nếu tài khoản tồn tại, hệ thống
      sẽ gửi link đặt lại mật khẩu có hiệu lực 30 phút.
    </p>

    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="form-floating mb-4">
        <input type="text" class="form-control" id="identifier" name="identifier"
               placeholder="Tên đăng nhập hoặc email" autocomplete="username" required />
        <label for="identifier">Tên đăng nhập hoặc email</label>
      </div>
      <button class="btn btn-primary w-100 btn-auth mb-3" type="submit">Gửi hướng dẫn</button>
    </form>

    <div class="text-center mt-3">
      <a href="{{ url_for('auth.login_view') }}" class="auth-link">Về trang đăng nhập</a>
    </div>
  </div>
</div>
{% endblock %}
