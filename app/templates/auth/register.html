{% extends 'layout/base.html' %}
{% block title %}Đăng Ký | Food Ordering System{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card auth-card-wide">
    <div class="auth-brand-mark" aria-hidden="true">T</div>
    <h1 class="auth-title">Tạo tài khoản</h1>
    <p class="auth-lead">Bắt đầu khám phá món ngon và đặt hàng thuận tiện.</p>

    {% if err_msg %}
    <div class="alert alert-danger" role="alert">{{ err_msg }}</div>
    {% endif %}

    <form action="{{ url_for('auth.register_process') }}" method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="username"
          name="username"
          minlength="3"
          autocomplete="username"
          placeholder="Tên đăng nhập"
          required />
        <label for="username">Tên đăng nhập</label>
      </div>

      <div class="form-floating mb-3">
        <input
          type="email"
          class="form-control"
          id="email"
          name="email"
          autocomplete="email"
          placeholder="Email"
          required />
        <label for="email">Email</label>
      </div>

      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="full_name"
          name="full_name"
          autocomplete="name"
          placeholder="Họ và tên" />
        <label for="full_name">Họ và tên</label>
      </div>

      <div class="form-floating mb-3">
        <input
          type="tel"
          class="form-control"
          id="phone"
          name="phone"
          autocomplete="tel"
          inputmode="numeric"
          pattern="[0-9]{10,11}"
          placeholder="Số điện thoại" />
        <label for="phone">Số điện thoại</label>
      </div>

      <div class="form-floating mb-3">
        <input
          type="text"
          class="form-control"
          id="address"
          name="address"
          autocomplete="street-address"
          placeholder="Địa chỉ" />
        <label for="address">Địa chỉ</label>
      </div>

      <div class="form-floating mb-3">
        <input
          type="password"
          class="form-control"
          id="password"
          name="password"
          minlength="6"
          autocomplete="new-password"
          placeholder="Mật khẩu"
          required />
        <label for="password">Mật khẩu</label>
      </div>

      <div class="form-floating mb-4">
        <input
          type="password"
          class="form-control"
          id="confirm"
          name="confirm"
          minlength="6"
          autocomplete="new-password"
          placeholder="Xác nhận mật khẩu"
          required />
        <label for="confirm">Xác nhận mật khẩu</label>
      </div>

      <button class="btn btn-primary w-100 btn-auth mb-3" type="submit">
        Tạo tài khoản
      </button>

      <div class="text-center mt-4">
        <span class="text-muted">Đã có tài khoản?</span>
        <a href="{{ url_for('auth.login_view') }}" class="auth-link fw-bold ms-1">Đăng nhập ngay</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
