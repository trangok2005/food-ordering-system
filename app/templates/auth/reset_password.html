{% extends 'layout/base.html' %}
{% block title %}Đặt lại mật khẩu | Food Ordering System{% endblock %}

{% block content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <h2 class="auth-title">Đặt lại mật khẩu</h2>

    {% if err_msg %}
    <div class="alert alert-danger" role="alert">{{ err_msg }}</div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="token" value="{{ token }}" />

      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="new_password" name="new_password"
               placeholder="Mật khẩu mới" required minlength="6" />
        <label for="new_password">Mật khẩu mới (tối thiểu 6 ký tự)</label>
      </div>
      <div class="form-floating mb-4">
        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
               placeholder="Nhập lại mật khẩu mới" required minlength="6" />
        <label for="confirm_password">Nhập lại mật khẩu mới</label>
      </div>

      <button class="btn btn-primary w-100 btn-auth mb-3" type="submit">ĐẶT LẠI MẬT KHẨU</button>
    </form>

    <div class="text-center mt-3">
      <a href="{{ url_for('auth.login_view') }}" class="auth-link">Về trang đăng nhập</a>
    </div>
  </div>
</div>
{% endblock %}
